<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../static/index/index.css" />
  <title>Wellness Login</title>
</head>
<body>
<canvas id="neural-bg"></canvas>
<a href="{{ url_for('home') }}" class="back-btn">← Back</a>

<!-- Main Layout -->
<main class="split-container">

  <!-- LEFT: Login Section -->
  <section class="left-section reveal">
    <h1>Start Your Wellness Journey</h1>
    <p class="subtitle">
      Sign in to access your personalized emotional wellness dashboard
    </p>

    <div class="auth-card">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="showLogin()">Login</button>
        <button class="tab" onclick="showRegister()">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="form active">
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter your email" required />

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter your password" required />

    <div style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
        <a href="#" onclick="forgotPassword()" style="color: #a855f7; font-size: 0.85rem; text-decoration: none;">Forgot Password?</a>
    </div>

    <button type="button" id="login-btn" class="primary-btn" onclick="login()">
        Sign In →
    </button>

    <div id="reset-section" style="display:none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
        <h4 style="color: #a855f7; margin-bottom: 10px;">Reset Password</h4>
        
        <label>OTP from Email</label>
        <input id="reset-otp" type="text" placeholder="6-digit code" maxlength="6" />

        <label>New Password</label>
        <input id="new-password" type="password" placeholder="Create new password" />

        <button type="button" class="primary-btn" style="background: #4f46e5; margin-top: 10px;" onclick="verifyResetAndChange()">
            Update Password
        </button>
    </div>
</form>

      <!-- Register Form -->
      <form id="registerForm" class="form hidden">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="Enter your full name" oninput="checkRegFields()" required />

          <label>Email</label>
          <input type="email" id="reg-email" placeholder="Enter your email" oninput="checkRegFields()" required />

          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Create a password" oninput="checkRegFields()" required />

          <button type="button" id="validate-mail-btn" class="primary-btn" onclick="sendRegistrationOTP()" disabled style="opacity: 0.5; cursor: not-allowed;">
              Validate Mail →
          </button>

          <div id="otp-section" style="display:none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
              <label>Enter 6-Digit OTP</label>
              <input type="text" id="reg-otp" placeholder="Enter code from email" maxlength="6" style="text-align: center; letter-spacing: 5px;" />
              <button type="button" class="primary-btn" style="background: linear-gradient(135deg, #6366f1, #a855f7);" onclick="verifyAndRegister()">
                  Verify & Create Account
              </button>
          </div>
      </form>

      <div class="divider">OR</div>

      <button class="viewer-btn" onclick="window.location.href='/health-tips'">Continue as Viewer</button>

      <div class="divider"></div>

      <!-- ADMIN LOGIN -->
      <button class="admin-btn" onclick="goToAdminLogin()">
        Login as Admin
      </button>

    </div>
  </section>

  <!-- RIGHT: Video Section -->
<section class="right-section">
<video autoplay muted loop playsinline 
       poster="https://res.cloudinary.com/dkjp9svlj/video/upload/w_854,q_auto:eco,f_auto/v1771454826/waves_3_lwwahi.jpg" 
       style="width:100%; height:100%; object-fit:cover;">
    
    <source src="https://res.cloudinary.com/dkjp9svlj/video/upload/w_854,br_1m,q_auto:eco,f_auto/v1771454826/waves_3_lwwahi.mp4" type="video/mp4" />
    
    Your browser does not support the video tag.
</video>
  <div class="video-overlay">
    <h2>Understand • Analyze • Heal</h2>
    <p>AI-powered emotional wellness platform</p>
  </div>
</section>

</main>
<script src="../../static/index/script.js"></script>
<script type="module" src="../../static/index/neural-bg.js"></script>
<!-- Music Player Script -->
<script src="../../static/music_player.js"></script>
</body>
</html>
